version: 2.1

commands:
  test-nodejs:
    steps:
      - run:
          name: Versions
          command: npm version
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Build
          command: npm run build
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Test
          command: npm run test
jobs:
  node-v8:
    docker:
      - image: node:20
    steps:
      - test-nodejs
  node-v22:
    docker:
      - image: node:22
    steps:
      - test-nodejs
  node-v24:
    docker:
      - image: node:24
    steps:
      - test-nodejs

workflows:
  version: 2
  node-multi-build:
    jobs:
      - node-v20
      - node-v22
      - node-v24
