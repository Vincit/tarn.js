version: 2.1

commands:
  test-nodejs:
    parameters:
      vitest-version:
        type: string
        default: ''
    steps:
      - run:
          name: Versions
          command: npm version
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - when:
          condition: << parameters.vitest-version >>
          steps:
            - run:
                name: Install vitest << parameters.vitest-version >>
                command: npm install vitest@<< parameters.vitest-version >>
      - run:
          name: Build
          command: npm run build
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Test
          command: npm run test
jobs:
  node-v14:
    docker:
      - image: node:14
    steps:
      - test-nodejs:
          vitest-version: '^0.34'
  node-v20:
    docker:
      - image: node:20
    steps:
      - test-nodejs
  node-v24:
    docker:
      - image: node:24
    steps:
      - test-nodejs

workflows:
  version: 2
  node-multi-build:
    jobs:
      - node-v14
      - node-v20
      - node-v24
